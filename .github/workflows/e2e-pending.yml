name: Pending E2E

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pending-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pending-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.34.4

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run pending Playwright tests
        id: pending-playwright
        run: pnpm exec playwright test --config e2e/playwright.pending.config.mjs

      - name: Upload pending E2E failure traces and screenshots
        if: failure() && steps.pending-playwright.outcome == 'failure'
        uses: actions/upload-artifact@v6
        with:
          name: pending-e2e-failure-${{ github.run_attempt }}
          path: e2e/test-results/
          if-no-files-found: warn
          retention-days: 7
