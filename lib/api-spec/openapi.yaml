    AreaScatterItem:
      type: object
      required:
        - areaName
        - tripCount
        - itemQuantity
        - revenueTwd
        - averageUnitProfitTwd
        - status
        - reason
      properties:
        areaName:
          type: string
          description: Trip area name merged across the store's trips
        tripCount:
          type: integer
        itemQuantity:
          type: ["string", "null"]
          description: Exact sum of actual order item quantities; null while pending_confirmation
        revenueTwd:
          type: ["string", "null"]
          description: Exact sum of included order totals; null while pending_confirmation
        averageUnitProfitTwd:
          type: ["string", "null"]
          description: Quantity-weighted average of existing per-product actual unit profits (scale 12)
        status:
          type: string
          enum: [ready, pending_confirmation]
        reason:
          type: ["string", "null"]

    AreaScatterResponse:
      type: object
      required: [status, items]
