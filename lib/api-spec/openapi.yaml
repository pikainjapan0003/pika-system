  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /me/store:
    get:
      operationId: getMyStore
      tags: [stores]
      summary: Get current merchant's store
      responses:
        "200":
          description: Store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Store"
        "404":
          description: No store found

  /stores:
    post:
      operationId: createStore
      tags: [stores]
      summary: Create a store
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StoreInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Store"

  /stores/{storeId}:
    patch:
      operationId: updateStore
      tags: [stores]
      summary: Update store
      parameters:
        - name: storeId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StoreUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Store"

  /stores/{storeId}/products:
    get:
      operationId: listProducts
      tags: [products]
      summary: List products for a store
      parameters:
        - name: storeId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Product list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"
    post:
      operationId: createProduct
      tags: [products]
      summary: Create a product
      parameters:
        - name: storeId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"

  /stores/{storeId}/products/{productId}:
    get:
      operationId: getProduct
      tags: [products]
      summary: Get a product
      parameters:
        - name: storeId
          in: path
          required: true
          schema:
            type: integer
        - name: productId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
    patch:
      operationId: updateProduct
      tags: [products]
      summary: Update a product
      parameters:
        - name: storeId
          in: path
          required: true
          schema:
            type: integer
        - name: productId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
    delete:
      operationId: deleteProduct
      tags: [products]
      summary: Delete a product
      parameters:
        - name: storeId
          in: path
          required: true
          schema:
            type: integer
        - name: productId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /trips:
    get:
      operationId: listTrips
      tags: [trips]
      summary: List trips (with their routes)
      responses:
        "200":
          description: Trip list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TripWithRoutes"
    post:
      operationId: createTrip
      tags: [trips]
      summary: Create a trip
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TripInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Trip"

  /stores/{storeId}/trips:
    get:
      operationId: listStoreTrips
      tags: [trips]
      summary: List a store's trips (with their routes)
      parameters:
        - name: storeId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Trip list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TripWithRoutes"
        "400":
          description: Invalid store id
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: Store not found

  /stores/{storeId}/charts/route-cost-ranking:
    get:
      operationId: listRouteCostRanking
      tags: [charts]
      summary: Per-route computed unit transport cost ranking (chart E)
      description: >
        Each route's unit cost is the finalCostPerItem from the existing
        transport-cost pipeline (resolveProductTransportCost). A route whose
        inputs are incomplete is reported pending_confirmation instead of a
        fake zero.
      parameters:
        - $ref: "#/components/parameters/StoreId"
      responses:
        "200":
          description: Route unit cost ranking
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RouteCostRankingResponse"
        "400":
          description: Invalid store id
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: Store not found

  /stores/{storeId}/charts/area-scatter:
    get:
      operationId: listAreaScatter
      tags: [charts]
      summary: Product performance aggregated by trip area (chart F)
      description: >
        Aggregates actual order performance (item quantity, revenue and
        quantity-weighted average unit profit) per trip area name across the
        store's trips. Uses the existing actual order quantity rollup and
        actual unit profit calculations; incomplete areas are reported
        pending_confirmation.
      parameters:
        - $ref: "#/components/parameters/StoreId"
      responses:
        "200":
          description: Area scatter aggregation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AreaScatterResponse"
        "400":
          description: Invalid store id
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: Store not found

  /stores/{storeId}/trips/{tripId}/charts/sensitivity-heatmap:
    get:
      operationId: getSensitivityHeatmap
      tags: [charts]
      summary: Breakeven sensitivity matrix over quantity x unit gross profit (chart G)
      description: >
        Sweeps quantity rows and unit-gross-profit columns against the trip's
        breakeven inputs (reuses calculateBreakeven). Each cell is the final
        profit quantity * unitGrossProfit - netCostToRecover as an exact
        decimal string (negative values are valid loss cells). Missing
        breakeven inputs are reported pending_confirmation.

        Required query inputs (validated by the route; intentionally not
        declared as OpenAPI query parameters because orval 8.9.1 emits a
        colliding 'operationIdParams' TS type when an operation has both path
        and query parameters):

        - 'quantities': comma-separated positive integers (row sweep, max 20)
        - 'unitGrossProfits': comma-separated non-negative decimals
          (column sweep, max 20)
      parameters:
        - $ref: "#/components/parameters/StoreId"
        - $ref: "#/components/parameters/TripId"
      responses:
        "200":
          description: Breakeven sensitivity matrix
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SensitivityHeatmapResponse"
        "400":
          description: Invalid store, trip or sweep parameters
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: Store or trip not found

