          items:
            $ref: "#/components/schemas/AreaScatterItem"

    SensitivityHeatmapResponse:
      type: object
      required:
        - status
        - netCostToRecoverTwd
        - breakevenQuantity
        - salaryTargetQuantity
        - rows
        - columns
        - cells
      properties:
        status:
          type: string
          enum: [ready, pending_confirmation]
        label:
          type: ["string", "null"]
        reason:
          type: ["string", "null"]
        netCostToRecoverTwd:
          type: ["string", "null"]
          description: From calculateBreakeven (scale 12); null while pending_confirmation
        breakevenQuantity:
          type: ["string", "null"]
          description: From calculateBreakeven; null while pending_confirmation
        salaryTargetQuantity:
          type: ["string", "null"]
        rows:
          type: array
          items:
            type: string
          description: Swept quantities (exact integer strings)
        columns:
          type: array
          items:
            type: string
          description: Swept unit gross profits (exact decimal strings)
        cells:
          type: array
          items:
            type: array
            items:
              type: string
          description: cells[row][col] = profitTwd = column * row - netCostToRecoverTwd (scale 12); negative values are loss cells

