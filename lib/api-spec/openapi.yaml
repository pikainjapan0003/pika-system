        projection final operating profit (reuses calculateTripProfit). A
        month containing a trip without complete actual data is reported
        pending_confirmation instead of a partial sum.
      parameters:
        - $ref: "#/components/parameters/StoreId"
      responses:
        "200":
          description: Monthly history trend
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HistoryTrendResponse"
        "400":
          description: Invalid store id
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: Store not found

